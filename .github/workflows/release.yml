name: Release CARE Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: care-desktop-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Read release version and immutable sources
        id: version
        run: |
          node <<'NODE'
          const fs = require("fs");
          const env = fs.readFileSync("deployments/.env", "utf8");
          const value = key => {
            const matches = [...env.matchAll(new RegExp(`^${key}=([^\\r\\n]*)$`, "gm"))];
            if (matches.length !== 1) throw new Error(`Expected one ${key} in deployments/.env`);
            return matches[0][1].trim();
          };
          const version = value("CARE_DESKTOP_VERSION");
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
            throw new Error("Releases require CARE_DESKTOP_VERSION=X.Y.Z (no -dev suffix)");
          }
          for (const key of ["CARE_BE_REF", "CARE_FE_REF"]) {
            if (!/^[0-9a-f]{40}$/i.test(value(key))) {
              throw new Error(`${key} must be a full commit SHA`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Reject an existing release version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | .html_url")
          if [ -n "$existing" ]; then
            echo "::error::Version $VERSION already has a release: $existing. Bump CARE_DESKTOP_VERSION; published assets are never replaced."
            exit 1
          fi

  checks:
    name: Check and build selected commit
    needs: prepare
    uses: ./.github/workflows/ci.yml

  package:
    name: Package installers
    needs: [prepare, checks]
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SIGN_MACOS: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-macos-unsigned
          path: incoming/macos
      - uses: actions/download-artifact@v8.0.1
        with:
          name: desktop-windows-unsigned
          path: incoming/windows
      - name: Import macOS signing certificate
        if: env.SIGN_MACOS == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw=$(uuidgen)
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package the CI-built applications
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p incoming/app release-assets staging
          ditto -x -k incoming/macos/desktop-macos-unsigned.zip incoming/app
          app=incoming/app/care-desktop.app
          test -d "$app"
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$actual" = "$VERSION"
          codesign --verify --strict "$app"
          if [ "$SIGN_MACOS" = "true" ]; then
            : "${SIGN_IDENTITY:?Missing MACOS_SIGN_IDENTITY}"
            : "${NOTARY_KEY:?Missing APPSTORE_PRIVATE_KEY}"
            : "${NOTARY_KEY_ID:?Missing APPSTORE_KEY_ID}"
            : "${NOTARY_ISSUER:?Missing APPSTORE_ISSUER_ID}"
            notary_key="$RUNNER_TEMP/notary.p8"
            (umask 077; printf '%s' "$NOTARY_KEY" > "$notary_key")
            notary=(--key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
            field() { python3 -c 'import sys,json; print(json.load(sys.stdin)["'"$1"'"])'; }
            notarize() {
              local id status
              id=$(xcrun notarytool submit "$1" "${notary[@]}" \
                --no-wait --output-format json | field id)
              [ -n "$id" ] || { echo "::error::No notarization submission ID"; exit 1; }
              echo "submitted $1 -> $id"
              for attempt in 1 2 3 4 5 6; do
                xcrun notarytool wait "$id" "${notary[@]}" --timeout 2h && break
                echo "::warning::Notarization poll $attempt failed; retrying."
              done
              status=$(xcrun notarytool info "$id" "${notary[@]}" \
                --output-format json | field status)
              if [ "$status" != "Accepted" ]; then
                echo "::error::Notarization status: $status"
                xcrun notarytool log "$id" "${notary[@]}"
                exit 1
              fi
            }
            codesign --force --timestamp --options runtime \
              --keychain "$SIGNING_KEYCHAIN" --sign "$SIGN_IDENTITY" "$app"
            codesign --verify --strict "$app"
            ditto -c -k --keepParent "$app" incoming/notarize.zip
            notarize incoming/notarize.zip
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
          else
            echo "::warning::MACOS_CERT_P12 is absent; macOS retains its ad-hoc signature only."
          fi
          ditto "$app" "staging/CARE Desktop.app"
          ln -s /Applications staging/Applications
          dmg="release-assets/CARE-Desktop-$VERSION-macos.dmg"
          hdiutil create -volname "CARE Desktop" -srcfolder staging -ov -format UDZO \
            "$dmg"
          if [ "$SIGN_MACOS" = "true" ]; then
            codesign --force --timestamp \
              --keychain "$SIGNING_KEYCHAIN" --sign "$SIGN_IDENTITY" "$dmg"
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
          fi
          test -s incoming/windows/desktop-windows-unsigned-setup.exe
          cp incoming/windows/desktop-windows-unsigned-setup.exe \
            "release-assets/CARE-Desktop-$VERSION-windows-amd64-setup.exe"
          cp deployments/.env release-assets/release-config.env
      - name: Remove macOS signing credentials
        if: always() && env.SIGN_MACOS == 'true'
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
      - name: Record build identity and checksums
        run: |
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const hash = path => crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex");
          const manifest = {
            version: process.env.VERSION,
            source_commit: process.env.GITHUB_SHA,
            configuration_sha256: hash("release-assets/release-config.env"),
            signing: {
              macos: process.env.SIGN_MACOS === "true" ? "developer-id-notarized" : "ad-hoc",
              windows: "unsigned",
            },
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.writeFileSync("release-assets/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          const files = fs.readdirSync("release-assets").sort();
          fs.writeFileSync("release-assets/SHA256SUMS",
            files.map(file => `${hash("release-assets/" + file)}  ${file}\n`).join(""));
          NODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: care-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: care-release-assets
          path: release-assets
      - name: Verify complete asset set
        working-directory: release-assets
        run: |
          test -s "CARE-Desktop-$VERSION-macos.dmg"
          test -s "CARE-Desktop-$VERSION-windows-amd64-setup.exe"
          test -s release-config.env
          test -s release-manifest.json
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum --check --strict SHA256SUMS
      - name: Create tag and draft without replacing published versions
        run: |
          tag="v$VERSION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
          if [ -n "$existing" ]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points to another commit. Use a new version."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          cat > release-notes.md <<EOF
          ## CARE Desktop $VERSION

          **Preview release.** Windows downloads are unsigned and may be blocked by SmartScreen.
          See release-manifest.json for each platform's actual signing status.
          macOS uses the existing Developer ID/notarization configuration when enabled;
          otherwise its ad-hoc signature is not trusted by Gatekeeper.

          - Source commit: $GITHUB_SHA
          - Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Exact dependency pins: release-config.env
          - Build identity: release-manifest.json
          - File integrity: SHA256SUMS (not a publisher signature)

          Before publishing, review the installers, test on a disposable clinic,
          and add upgrade notes, database migration requirements, and known limitations.
          Preserve the clinic CA and take a verified backup before upgrading an existing clinic.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "CARE Desktop $VERSION (preview)" \
            --notes-file release-notes.md release-assets/*
