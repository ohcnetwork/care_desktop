name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      # The Wails build embeds app/install, which is staged from the repo root by
      # the frontend build. A placeholder is enough for `go build` and `go vet`.
      - name: Stage embed placeholder
        run: mkdir -p install && touch install/.keep

      - name: Build (host)
        run: go build ./...

      # internal/ must stay free of Wails so the engine is testable and portable.
      # The CLI used to prove this by compiling; assert it directly instead.
      - name: internal/ must not import Wails
        run: |
          if grep -rq "wailsapp/wails" internal/; then
            echo "internal/ must not import Wails - keep UI concerns in app/*.go"
            grep -rn "wailsapp/wails" internal/
            exit 1
          fi

      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci

      - run: npm run build
