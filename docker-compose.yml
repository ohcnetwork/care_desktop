name: care-desktop

networks:
  default:
    name: care-desktop

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:

# The origin every device uses. Set as `environment:` so it overrides backend.env
# (compose gives environment: precedence over env_file). The .invalid default can
# never resolve, so a stack started without the engine fails visibly, not halfway.
x-public-origin: &public-origin
  CARE_PUBLIC_ORIGIN: ${CARE_PUBLIC_ORIGIN:-https://not-configured.invalid}
  BUCKET_EXTERNAL_ENDPOINT: ${CARE_PUBLIC_ORIGIN:-https://not-configured.invalid}
  CSRF_TRUSTED_ORIGINS: '["${CARE_PUBLIC_ORIGIN:-https://not-configured.invalid}"]'

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine}
    restart: unless-stopped
    env_file: ./backend.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:8.8.0-alpine}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
      - ./minio/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # No host port: browsers reach files through Caddy (/patient-bucket,
    # /facility-bucket), so they're same-origin with the app.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ohcnetwork/care:latest}
    restart: unless-stopped
    env_file: ./backend.env
    volumes:
      - ./clinic_settings.py:/settings/clinic_settings.py:ro
    environment: *public-origin
    entrypoint: ["bash", "start.sh"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery-worker:
    image: ${BACKEND_IMAGE:-ghcr.io/ohcnetwork/care:latest}
    restart: unless-stopped
    env_file: ./backend.env
    volumes:
      - ./clinic_settings.py:/settings/clinic_settings.py:ro
    environment: *public-origin
    entrypoint: ["bash", "celery_worker.sh"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery-beat:
    image: ${BACKEND_IMAGE:-ghcr.io/ohcnetwork/care:latest}
    restart: unless-stopped
    env_file: ./backend.env
    volumes:
      - ./clinic_settings.py:/settings/clinic_settings.py:ro
    environment: *public-origin
    entrypoint: ["bash", "celery_beat.sh"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    image: ${FRONTEND_IMAGE:-care_fe:clinic}   # built by `care setup` / `care rebuild-frontend`
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: ${CADDY_WAF_IMAGE:-care-caddy:clinic-tls}   # caddy + Coraza WAF + Cloudflare DNS, built by `care setup`
    restart: unless-stopped
    environment:
      CARE_PUBLIC_HOST: ${CARE_PUBLIC_HOST:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CARE_ACME_CA: ${CARE_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CARE_HSTS_SECONDS: ${CARE_HSTS_SECONDS:-2592000}
    ports:
      - "443:443"             # the clinic app. No port 80 by design - see Caddyfile.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # ACME account key + issued certs live here; keep it
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
      - minio

  backup:
    image: ${BACKUP_IMAGE:-care-backup:clinic}   # postgres + openssl, built by `care setup`
    restart: unless-stopped
    env_file: ./backend.env
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./db-backups}:/backups     # the app points this at your Desktop/chosen folder
      - ./keys:/keys:ro                          # backup-cert.pem (encrypt) + backup-key.pem.enc (restore); absent = plaintext
      - minio-data:/minio-data:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}
