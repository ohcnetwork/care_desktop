version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell

  settings:
    staticcheck:
      # Internal application packages do not need public API documentation.
      # UI-facing errors deliberately use sentence capitalization.
      checks: ["all", "-ST1000", "-ST1005", "-ST1020", "-ST1021", "-ST1022"]

formatters:
  enable:
    - gofmt
